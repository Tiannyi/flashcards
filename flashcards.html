<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Phonics Flashcards</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container { max-width: 400px; width: 100%; }
    .flashcard {
      width: 100%;
      height: 280px;
      background: white;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
      padding: 20px;
      position: relative;
    }
    .label {
      font-size: 14px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }
    .letter {
      font-size: 100px;
      font-weight: bold;
      color: #333;
      line-height: 1;
    }
    .sound {
      font-size: 20px;
      color: #666;
      margin-top: 15px;
      padding: 8px 16px;
      background: #f5f5f5;
      border-radius: 20px;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
      width: 100%;
    }
    .nav button {
      background: white;
      border: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    .nav button:hover { transform: scale(1.05); }
    .nav button:disabled { opacity: 0.5; cursor: not-allowed; }
    .counter {
      color: white;
      font-size: 16px;
    }
    .category-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab {
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
    }
    .tab.active { background: white; color: #667eea; }
  </style>
</head>
<body>
  <div class="category-tabs">
    <button class="tab active" onclick="setCategory('diagrams')">Diagrams</button>
    <button class="tab" onclick="setCategory('consonants')">Consonants</button>
    <button class="tab" onclick="setCategory('vowels')">Vowels</button>
  </div>
  
  <div class="container">
    <div class="flashcard">
      <div class="label">Diagram</div>
      <div class="letter">sh</div>
      <div class="sound">/ʃ/ like in "ship"</div>
    </div>
    
    <div class="nav">
      <button onclick="prev()">◀ Prev</button>
      <span class="counter">1 / 8</span>
      <button onclick="next()">Next ▶</button>
    </div>
  </div>

  <script>
    const cards = {
      diagrams: [
        { label: "Diagram", letter: "sh", sound: "/ʃ/ like in 'ship'" },
        { label: "Diagram", letter: "ch", sound: "/tʃ/ like in 'chair'" },
        { label: "Diagram", letter: "th", sound: "/θ/ like in 'think'" },
        { label: "Diagram", letter: "ph", sound: "/f/ like in 'phone'" },
        { label: "Diagram", letter: "wh", sound: "/w/ like in 'what'" },
        { label: "Diagram", letter: "ng", sound: "/ŋ/ like in 'sing'" },
        { label: "Diagram", letter: "ck", sound: "/k/ like in 'clock'" },
        { label: "Diagram", letter: "qu", sound: "/kw/ like in 'queen'" }
      ],
      consonants: [
        { label: "Consonant", letter: "b", sound: "/b/ like in 'bat'" },
        { label: "Consonant", letter: "c", sound: "/k/ like in 'cat'" },
        { label: "Consonant", letter: "d", sound: "/d/ like in 'dog'" },
        { label: "Consonant", letter: "f", sound: "/f/ like in 'fish'" },
        { label: "Consonant", letter: "g", sound: "/g/ like in 'go'" },
        { label: "Consonant", letter: "h", sound: "/h/ like in 'hat'" },
        { label: "Consonant", letter: "j", sound: "/dʒ/ like in 'jump'" },
        { label: "Consonant", letter: "k", sound: "/k/ like in 'kite'" },
        { label: "Consonant", letter: "l", sound: "/l/ like in 'lion'" },
        { label: "Consonant", letter: "m", sound: "/m/ like in 'moon'" },
        { label: "Consonant", letter: "n", sound: "/n/ like in 'nest'" },
        { label: "Consonant", letter: "p", sound: "/p/ like in 'pig'" },
        { label: "Consonant", letter: "q", sound: "/kw/ like in 'queen'" },
        { label: "Consonant", letter: "r", sound: "/r/ like in 'rabbit'" },
        { label: "Consonant", letter: "s", sound: "/s/ like in 'sun'" },
        { label: "Consonant", letter: "t", sound: "/t/ like in 'tree'" },
        { label: "Consonant", letter: "v", sound: "/v/ like in 'van'" },
        { label: "Consonant", letter: "w", sound: "/w/ like in 'water'" },
        { label: "Consonant", letter: "x", sound: "/ks/ like in 'fox'" },
        { label: "Consonant", letter: "y", sound: "/j/ like in 'yes'" },
        { label: "Consonant", letter: "z", sound: "/z/ like in 'zebra'" }
      ],
      vowels: [
        { label: "Vowel", letter: "a", sound: "/æ/ as in 'apple' (short) | /eɪ/ as in 'cake' (long)" },
        { label: "Vowel", letter: "e", sound: "/ɛ/ as in 'bed' (short) | /iː/ as in 'bee' (long)" },
        { label: "Vowel", letter: "i", sound: "/ɪ/ as in 'sit' (short) | /aɪ/ as in 'time' (long)" },
        { label: "Vowel", letter: "o", sound: "/ɒ/ as in 'hot' (short) | /oʊ/ as in 'home' (long)" },
        { label: "Vowel", letter: "u", sound: "/ʌ/ as in 'cup' (short) | /juː/ as in 'use' (long)" },
        { label: "Vowel", letter: "y", sound: "/j/ as in 'yes' | /ɪ/ as in 'myth' | /iː/ as in 'happy'" }
      ]
    };

    let currentCategory = 'diagrams';
    let currentIndex = 0;

    function setCategory(cat) {
      currentCategory = cat;
      currentIndex = 0;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      updateCard();
    }

    function updateCard() {
      const list = cards[currentCategory];
      const card = list[currentIndex];
      document.querySelector('.label').textContent = card.label;
      document.querySelector('.letter').textContent = card.letter;
      document.querySelector('.sound').textContent = card.sound;
      document.querySelector('.counter').textContent = `${currentIndex + 1} / ${list.length}`;
    }

    function next() {
      const list = cards[currentCategory];
      if (currentIndex < list.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function prev() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }
  </script>
</body>
</html>
